<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提瓦特情報局 - LINE Bot</title>
    <style>
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #111424 0%, #1c223a 100%);
            color: #ece5d8;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 15px;
            border: 1px solid #cca566;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        h1 {
            color: #cca566;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.1em;
            line-height: 1.6;
            color: #b3b9c9;
        }
        .status {
            display: inline-block;
            background: #277454;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ 提瓦特情報局 ✨</h1>
        <p>專屬的原神爬蟲 LINE 聊天機器人後端已成功啟動！</p>
        <p>本系統已與 Dialogflow 及 LINE 串接，隨時為旅行者提供最新的角色與攻略資料。</p>
        
        <div class="status">● 系統運作正常 (Webhook Online)</div>
    </div>

</body>
</html>
